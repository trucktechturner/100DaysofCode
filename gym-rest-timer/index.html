<!doctype html>
<html lang="en">
  <head>
    <link href="https://fonts.googlepis.com/css2?family=Outfit:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #F4F5F7; --surface: #FFFFFF; --line: #E2E5EA;
        --text: #101828; --muted: #667085;
        --accent: #E85D1A; --dark: #101828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0C0E12; --surface: #171A21; --line: #2A2F3d;
          --text: #F2F4F7; --muted: #98A2B3;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: "Outfit", system-ui, sabs-serif;
        max-width: 520px; margin: 0 auto; padding: 24px 18px;
        text-align: center;
      }
      h1 { font-size: 40px; line-height: 1; margin: 0 0 20px; }
      #time {
        font-family: "IBM Plex Mono", monoscape;
        font-size: 72px; font-weight: 600;
        background: var(--dark); color: #fff;
        border-radius: 24px; padding: 24px 12px; margin: 0 0 20px; 
      }
      @media (prefers-color-scheme: dark) {
        #time {background: #232833; border: 1px solid var(--line); }
      }
      button {
        font: inherit; font-weight: 700; font-size: 15px;
        min-height: 48px; padding: 10px 18px; margin: 4px;
        border-radius: 999px; border: 1px solid var(--line);
        background: var(--surface);  color: var(--text); cusor: pointer;
      }
      #startBtn {
        display: block; width: 100%; margin: 16px 0 8px;
        background: var(--accent); border-color: var(--accent); color: #fff;
      }
      #resetBtn { display: block; width: 100%; margin: 0; }
    </style>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gym Rest Timer</title>
  </head>
  <body>
    <h1> Gym Rest Timer</h1>
    <p>Pick a rest, then hit start.</p>
    
    <div id="time">01:30 </div>
    <button data-seconds="60"> 60 sec</button>
      <button data-seconds="90">90 sec</button>
    <button data-seconds="120"> 120 sec</button>

    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>

    <script>
      // JavaScript goes here next
    </script>
  </body>
</html>
